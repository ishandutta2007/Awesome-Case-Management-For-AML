<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 44px; fill: url(#textGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }

    /* Animated background elements */
    @keyframes pulseNode {
      0% { r: 6px; opacity: 0.4; }
      50% { r: 10px; opacity: 0.9; filter: drop-shadow(0 0 8px #38bdf8); }
      100% { r: 6px; opacity: 0.4; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(350px); opacity: 0.2; }
    }

    .node1 { animation: pulseNode 3s infinite ease-in-out; }
    .node2 { animation: pulseNode 3s infinite ease-in-out 1s; }
    .node3 { animation: pulseNode 3s infinite ease-in-out 2s; }

    .flow-line { stroke: #38bdf8; stroke-width: 2; stroke-dasharray: 8 6; animation: dashFlow 2s linear infinite; opacity: 0.5; }
    .radar-sweep { stroke: url(#textGrad); stroke-width: 1.5; opacity: 0.3; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="350" rx="16" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Dynamic / Animated Flow Connections in Background -->
  <g opacity="0.6">
    <!-- Network Graph Lines -->
    <path d="M 150 80 L 300 180 L 200 280 L 80 200 Z" stroke="#334155" stroke-width="1.5" fill="none"/>
    <path d="M 300 180 L 450 120 L 500 260 L 350 300" stroke="#334155" stroke-width="1.5" fill="none"/>
    <path d="M 850 70 L 1020 150 L 1100 270 L 920 290 Z" stroke="#334155" stroke-width="1.5" fill="none"/>
    <path d="M 700 160 L 850 70" stroke="#334155" stroke-width="1.5" fill="none"/>

    <!-- Animated Data Flow Lines -->
    <path d="M 150 80 L 300 180 L 500 260" class="flow-line" fill="none"/>
    <path d="M 850 70 L 1020 150 L 1100 270" class="flow-line" fill="none"/>

    <!-- Graph Nodes -->
    <circle cx="150" cy="80" r="7" fill="#38bdf8" class="node1"/>
    <circle cx="300" cy="180" r="7" fill="#818cf8" class="node2"/>
    <circle cx="200" cy="280" r="7" fill="#c084fc" class="node3"/>
    <circle cx="450" cy="120" r="7" fill="#38bdf8" class="node2"/>
    <circle cx="500" cy="260" r="7" fill="#818cf8" class="node1"/>
    
    <circle cx="850" cy="70" r="7" fill="#38bdf8" class="node3"/>
    <circle cx="1020" cy="150" r="7" fill="#c084fc" class="node1"/>
    <circle cx="1100" cy="270" r="7" fill="#818cf8" class="node2"/>
    <circle cx="920" cy="290" r="7" fill="#38bdf8" class="node3"/>
  </g>

  <!-- Foreground Content Card (Ensures Titles/Text are prominent and unobstructed) -->
  <g transform="translate(150, 45)">
    <!-- Central Glassmorphism Card -->
    <rect width="900" height="260" rx="16" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" filter="url(#glow)"/>
    
    <!-- Title and Subtitle -->
    <text x="450" y="70" text-anchor="middle" class="title">Awesome AML Case Management</text>
    <text x="450" y="110" text-anchor="middle" class="subtitle">Curated Ecosystem of SaaS &amp; Open-Source AML Platforms</text>
    
    <!-- Feature Pills -->
    <g transform="translate(100, 150)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="200" height="42" rx="21" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="100" y="26" text-anchor="middle" class="badge-text">🔍 Alert Triage</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(230, 0)">
        <rect width="220" height="42" rx="21" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
        <text x="110" y="26" text-anchor="middle" class="badge-text">⚡ SAR / STR Filing</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(470, 0)">
        <rect width="230" height="42" rx="21" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
        <text x="115" y="26" text-anchor="middle" class="badge-text">🛡️ Transaction Audit</text>
      </g>
    </g>

    <!-- Sub-text / Stats footer -->
    <text x="450" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
      Open-Source Engines • AI Investigation Workflows • Compliance Audit Trails
    </text>
  </g>
</svg>
